<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Donat Bot - Do'kon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        header { margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .info h3 { font-size: 16px; color: #f1f5f9; margin-bottom: 4px; }
        .info span { color: #38bdf8; font-size: 14px; font-weight: bold; }
        button { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Ultimate Donat Do'koni</h1>
        <p>O'yinlar va xizmatlarni eng qulay narxlarda xarid qiling</p>
    </header>

    <div class="grid">
        <div class="card">
            <div class="info">
                <h3>Telegram Premium (1 oy)</h3>
                <span>40,000 so'm</span>
            </div>
            <button onclick="buyItem('Telegram Premium 1 oy', 40000)">Sotib olish</button>
        </div>

        <div class="card">
            <div class="info">
                <h3>Telegram Premium (1 yil)</h3>
                <span>300,000 so'm</span>
            </div>
            <button onclick="buyItem('Telegram Premium 1 yil', 300000)">Sotib olish</button>
        </div>

        <div class="card">
            <div class="info">
                <h3>PUBG Mobile UC</h3>
                <span>Kelishilgan holda</span>
            </div>
            <button onclick="buyItem('PUBG UC', 0)">Buyurtma</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function buyItem(itemName, price) {
            alert(itemName + " tanlandi! Admin bilan bog'laning yoki balansdan yechiladi.");
            // Bu yerda kerak bo'lsa ma'lumotni botga yuborish mumkin
        }
    </script>
</body>
</html>
